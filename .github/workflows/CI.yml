name: Refactor Sfyrise UI (CI)

on:
  push:
    branches: 
      - prod
      - preprod
  pull_request:
    branches:
      - prod
      - preprod

jobs:
  # Job 1 : Lint
  lint:
    name: Lint Code
    runs-on: self-hosted

    steps:
      - name: Cleanup workspace
        run: rm -rf ${{ github.workspace }}/* 2>/dev/null || true
          
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint

  # Job 2 : Cache Next.js build artifacts
  caching:
    name: Cache Next.js
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

  # Job 3 : Build
  build:
    name: Build Next.js Application
    runs-on: self-hosted
    needs: [lint, caching]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
     
      - name: Build Docker image
        run: |
          sudo docker build . \
            --file Dockerfile \
            --tag job-${{ github.run_id }}:${{ github.sha }} \
            --tag job-${{ github.run_id }}:latest \
            --tag ${{ secrets.DOCKER_USERNAME }}/sfyrisec-refactor-app-image:latest-refactor-ui

  # Job 4 : Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: self-hosted
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          cache: true
          version: v0.64.1

      # Docker image scan (SARIF for GitHub Security)
      - name: Run Trivy vulnerability scanner on Docker image
        run: |
          sudo trivy image \
            --format sarif \
            --output trivy-image-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            'job-${{ github.run_id }}:latest'

      - name: Upload Docker image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

      # Docker image vulnerabilities (table format for logs with exit code)
      - name: Run Trivy on Docker image (fail on critical/high)
        run: |
          sudo trivy image \
            --format table \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            'job-${{ github.run_id }}:latest'

  docker-push:
    name: Push Docker Image to Registry
    runs-on: self-hosted
    needs: [security-scan, build]
    if: github.event_name == 'push'

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image to Docker Hub
        run: sudo docker push ${{ secrets.DOCKER_USERNAME }}/sfyrisec-refactor-app-image:latest-refactor-ui