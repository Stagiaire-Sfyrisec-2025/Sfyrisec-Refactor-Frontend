name: Refactor Sfyrise UI (CI)

on:
  push:
    branches: 
      - prod
      - preprod
  pull_request:
    branches:
      - prod
      - preprod

jobs:
  # Job 1 : Lint
  lint:
    name: Lint Code
    runs-on: self-hosted
    steps:      
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint