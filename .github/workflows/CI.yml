name: Refactor Sfyrise UI (CI)

on:
  push:
    branches: 
      - prod
      - preprod
  pull_request:
    branches:
      - prod
      - preprod

jobs:
  # Job 1 : Lint
  lint:
    name: Lint Code
    runs-on: self-hosted

    steps:
      - name: Cleanup workspace
        run: rm -rf ${{ github.workspace }}/* 2>/dev/null || true
          
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint

  # Job 2 : Cache Next.js build artifacts
  caching:
    name: Cache Next.js
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Cache Next.js build
        id: cache-next
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # Cache key depends on package-lock.json and source files
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

  # Job 3 : Build
  build:
    name: Build Next.js Application
    runs-on: self-hosted
    needs: [lint, caching]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      
      - name: Build Docker image
        run: |
          sudo docker build . \
            --file Dockerfile \
            --tag job-${{ github.run_id }}:${{ github.sha }} \
            --tag job-${{ github.run_id }}:latest \
            --tag ${{ secrets.DOCKER_USERNAME }}/sfyrisec-refactor-app-image:latest-refactor-ui

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push'
        run: sudo docker push ${{ secrets.DOCKER_USERNAME }}/sfyrisec-refactor-app-image:latest-refactor-ui